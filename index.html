<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jornada">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Registro de Jornada</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f0f2f5;--bg2:#fff;--bg3:#f8f9fb;--border:#e2e8f0;--border2:#cbd5e1;--text:#0f172a;--text2:#475569;--text3:#94a3b8;--accent:#1e40af;--accent2:#1d4ed8;--accent-light:#dbeafe;--green:#166534;--green-bg:#dcfce7;--red:#991b1b;--red-bg:#fee2e2;--amber:#92400e;--amber-bg:#fef3c7;--header:#1e3a5f;--day-work:#eff6ff;--day-wb:#bfdbfe;--day-we:#f8fafc;--day-web:#e2e8f0;--day-fest:#fffbeb;--day-festb:#fde68a;--mod:#f59e0b;--num:#1e40af;--num-we:#94a3b8;--num-fest:#d97706;--topbar:#1e3a5f}
[data-theme=dark]{--bg:#0f172a;--bg2:#1e293b;--bg3:#162032;--border:#334155;--border2:#475569;--text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;--accent:#3b82f6;--accent2:#60a5fa;--accent-light:#1e3a5f;--green:#4ade80;--green-bg:#14532d;--red:#f87171;--red-bg:#450a0a;--amber:#fbbf24;--amber-bg:#451a03;--header:#0f172a;--day-work:#1e293b;--day-wb:#1e40af;--day-we:#1a2332;--day-web:#334155;--day-fest:#1c1a0a;--day-festb:#78350f;--num:#1e40af;--num-we:#475569;--topbar:#0f172a}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}
/* TOPBAR */
.topbar{background:var(--topbar);color:#fff;padding:14px 16px 12px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.topbar-back{background:none;border:none;color:#fff;font-size:1.4rem;cursor:pointer;padding:4px 10px 4px 0;line-height:1}
.topbar-title{font-size:1.1rem;font-weight:700;flex:1}
.topbar-theme{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 12px;font-size:.82rem;font-weight:600;font-family:inherit;cursor:pointer}
/* HOME */
.home-header{background:var(--topbar);color:#fff;padding:22px 20px 26px;padding-top:calc(22px + env(safe-area-inset-top))}
.home-header h1{font-size:1.55rem;font-weight:800;letter-spacing:-.5px}
.home-empresa{font-size:.9rem;opacity:.7;margin-top:3px;font-weight:500}
.home-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn-ghost{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);color:#fff;border-radius:9px;padding:8px 16px;font-size:.88rem;font-weight:600;font-family:inherit;cursor:pointer}
/* YEAR */
.year-switcher{display:flex;align-items:center;justify-content:center;gap:24px;padding:16px 20px 8px}
.year-btn{background:var(--bg2);border:2px solid var(--border2);border-radius:50%;width:36px;height:36px;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:700}
.year-label{font-size:1.35rem;font-weight:800;color:var(--text);min-width:56px;text-align:center}
/* MONTHS */
.months-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:6px 14px 28px}
.month-tile{background:var(--bg2);border-radius:13px;padding:15px 8px 13px;text-align:center;cursor:pointer;border:2px solid var(--border);user-select:none;-webkit-touch-callout:none}
.month-tile:active{transform:scale(.95)}
.month-tile.done{border-color:var(--accent);background:var(--accent-light)}
.month-tile.current{border-color:var(--accent2)}
.m-name{font-size:.95rem;font-weight:700;color:var(--text)}
.m-status{font-size:.68rem;font-weight:700;text-transform:uppercase;margin-top:5px;padding:2px 7px;border-radius:20px;display:inline-block}
.month-tile.done .m-status{background:var(--accent);color:#fff}
.month-tile:not(.done) .m-status{background:var(--bg3);color:var(--text3)}
.m-hours{font-size:.7rem;color:var(--green);margin-top:3px;font-weight:600}
/* MONTH SCREEN */
.month-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.month-meta{background:var(--bg2);margin:12px 12px 0;border-radius:12px;padding:10px 14px;border:1px solid var(--border);font-size:.84rem;color:var(--text2)}
.month-meta strong{color:var(--accent)}
.action-bar{display:flex;gap:8px;padding:10px 12px 2px}
.btn-fill{flex:1;padding:11px 8px;border-radius:10px;font-size:.86rem;font-weight:700;font-family:inherit;border:none;cursor:pointer}
.btn-fill:active{opacity:.8}
.btn-primary{background:var(--accent);color:#fff}
.btn-danger{background:var(--red-bg);color:var(--red)}
[data-theme=dark] .btn-danger{color:#fca5a5}
.days-list{padding:8px 12px 110px}
/* DAY CARD */
.day-card{background:var(--bg2);border-radius:12px;margin-bottom:7px;border:2px solid var(--border);overflow:hidden}
.day-card.workday{background:var(--day-work);border-color:var(--day-wb)}
.day-card.weekend{background:var(--day-we);border-color:var(--day-web)}
.day-card.festivo{background:var(--day-fest);border-color:var(--day-festb)}
.day-card.modified{border-color:var(--mod)}
.day-header{display:flex;align-items:center;padding:9px 13px 9px 11px;gap:10px;cursor:pointer;user-select:none}
.day-num-wrap{width:40px;height:40px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--num);color:#fff;flex-shrink:0}
.day-card.weekend .day-num-wrap{background:var(--num-we)}
.day-card.festivo .day-num-wrap{background:var(--num-fest)}
.day-num{font-size:1.1rem;font-weight:800;line-height:1}
.day-name-lbl{font-size:.56rem;text-transform:uppercase;opacity:.8}
.day-summary{flex:1;min-width:0}
.day-preview{font-size:.82rem;color:var(--text2);line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-preview.empty{color:var(--text3);font-style:italic}
.day-total{font-size:.82rem;font-weight:700;color:var(--green);flex-shrink:0;padding-left:6px}
.day-body{display:none;padding:2px 13px 13px;border-top:1px solid var(--border)}
.day-card.open .day-body{display:block}
.time-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}
.time-field label{display:block;font-size:.7rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.time-field input[type=time]{width:100%;padding:10px 11px;border:2px solid var(--border);border-radius:10px;font-size:1.05rem;font-family:inherit;color:var(--text);background:var(--bg3);-webkit-appearance:none;outline:none}
.time-field input[type=time]:focus{border-color:var(--accent);background:var(--bg2)}
.day-actions{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.day-btn{flex:1;min-width:76px;padding:8px 6px;border-radius:9px;font-size:.8rem;font-weight:600;font-family:inherit;border:none;cursor:pointer}
.day-btn:active{opacity:.75}
.btn-festivo{background:var(--amber-bg);color:var(--amber)}
.btn-festivo.on{background:var(--amber);color:#fff}
.btn-reset{background:var(--accent-light);color:var(--accent)}
[data-theme=dark] .btn-reset{color:var(--accent2)}
.btn-clear{background:var(--red-bg);color:var(--red)}
[data-theme=dark] .btn-clear{color:#fca5a5}
/* TOTAL BAR */
.total-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;z-index:40;box-shadow:0 -2px 12px rgba(0,0,0,.1)}
.total-info{flex:1}
.total-label{font-size:.78rem;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.total-value{font-size:1.15rem;font-weight:800;color:var(--accent);margin-top:1px}
.btn-pdf{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 20px;font-size:.9rem;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap}
.btn-pdf:active{background:var(--accent2)}
/* CONFIG */
.config-content{flex:1;overflow-y:auto;padding:14px;padding-bottom:40px}
.config-section{background:var(--bg2);border-radius:13px;overflow:hidden;margin-bottom:14px;border:1px solid var(--border)}
.section-title{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);padding:10px 15px 8px;background:var(--bg3);border-bottom:1px solid var(--border)}
.config-field{padding:11px 15px;border-bottom:1px solid var(--border)}
.config-field:last-child{border-bottom:none}
.config-field label{display:block;font-size:.72rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.config-field input{width:100%;padding:9px 0;border:none;border-bottom:2px solid var(--border);font-size:1rem;font-family:inherit;color:var(--text);background:transparent;outline:none}
.config-field input:focus{border-bottom-color:var(--accent)}
.btn-save{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:13px;font-size:1rem;font-weight:700;font-family:inherit;cursor:pointer;margin-bottom:10px}
/* FIRMA CANVAS */
.firma-canvas-wrap{padding:14px 14px 10px;display:flex;flex-direction:column;align-items:center;gap:10px}
.firma-canvas-wrap p{font-size:.78rem;color:var(--text3);text-align:center}
#firmaCanvas{border:2px dashed var(--border2);border-radius:10px;background:#fff;cursor:crosshair;touch-action:none;display:block;width:100%;max-width:380px}
.firma-saved-wrap{padding:0 14px 12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.firma-saved-img{border:1.5px solid var(--border);border-radius:8px;max-width:200px;max-height:70px;object-fit:contain;background:#fff}
.firma-saved-label{font-size:.75rem;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.firma-actions{display:flex;gap:8px;width:100%;max-width:380px}
.btn-firma-clear{flex:1;padding:9px;border-radius:9px;font-size:.84rem;font-weight:600;font-family:inherit;border:none;cursor:pointer;background:var(--red-bg);color:var(--red)}
[data-theme=dark] .btn-firma-clear{color:#fca5a5}
.btn-firma-save{flex:2;padding:9px;border-radius:9px;font-size:.84rem;font-weight:700;font-family:inherit;border:none;cursor:pointer;background:var(--accent);color:#fff}
.firma-status{font-size:.78rem;font-weight:600;color:var(--green);text-align:center;padding:0 14px 10px;min-height:1.1rem}
/* TOAST */
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--text);color:var(--bg);padding:10px 22px;border-radius:24px;font-size:.88rem;font-weight:600;opacity:0;transition:all .22s;z-index:999;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* LOADING */
.loading-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.loading-overlay.show{display:flex}
.spinner{width:44px;height:44px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .65s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:#fff;font-weight:600}
</style>
</head>
<body>

<!-- HOME -->
<div class="screen active" id="screen-home">
  <div class="home-header">
    <h1>Registro de Jornada</h1>
    <div class="home-empresa">BEDUNDE S.L</div>
    <div class="home-actions">
      <button class="btn-ghost" onclick="showConfig()">Ajustes</button>
      <button class="btn-ghost" id="themeBtn" onclick="toggleTheme()">Tema oscuro</button>
    </div>
  </div>
  <div class="year-switcher">
    <button class="year-btn" onclick="changeYear(-1)">&#8249;</button>
    <span class="year-label" id="yearLabel">2026</span>
    <button class="year-btn" onclick="changeYear(1)">&#8250;</button>
  </div>
  <div class="months-grid" id="monthsGrid"></div>
</div>

<!-- MONTH -->
<div class="screen" id="screen-month">
  <div class="topbar">
    <button class="topbar-back" onclick="showHome()">&#8592;</button>
    <span class="topbar-title" id="monthTitle"></span>
    <button class="topbar-theme" id="topbarThemeBtn" onclick="toggleTheme()">Oscuro</button>
  </div>
  <div class="month-content">
    <div class="month-meta" id="monthMeta"></div>
    <div class="action-bar">
      <button class="btn-fill btn-primary" onclick="autoFillMonth()">Rellenar automatico</button>
      <button class="btn-fill btn-danger" onclick="clearMonth()">Vaciar mes</button>
    </div>
    <div class="days-list" id="daysList"></div>
  </div>
  <div class="total-bar">
    <div class="total-info">
      <div class="total-label">Total mes</div>
      <div class="total-value" id="totalValue">0h 00min</div>
    </div>
    <button class="btn-pdf" onclick="downloadPDF()">Descargar PDF</button>
  </div>
</div>

<!-- CONFIG -->
<div class="screen" id="screen-config">
  <div class="topbar">
    <button class="topbar-back" onclick="showHome()">&#8592;</button>
    <span class="topbar-title">Ajustes</span>
  </div>
  <div class="config-content">
    <div class="config-section">
      <div class="section-title">Trabajadora</div>
      <div class="config-field"><label>Nombre completo</label><input id="cf_nombre" autocomplete="off"></div>
      <div class="config-field"><label>NIF / NIE</label><input id="cf_nif" autocomplete="off"></div>
      <div class="config-field"><label>N&#xBA; Afiliacion SS</label><input id="cf_afil" autocomplete="off"></div>
      <div class="config-field"><label>Ciudad de firma</label><input id="cf_ciudad" autocomplete="off"></div>
    </div>
    <div class="config-section">
      <div class="section-title">Firma de la trabajadora</div>
      <div class="firma-canvas-wrap">
        <p>Dibuja tu firma con el dedo en el recuadro</p>
        <canvas id="firmaCanvas" width="600" height="180"></canvas>
        <div class="firma-actions">
          <button class="btn-firma-clear" onclick="clearFirmaCanvas()">Borrar</button>
          <button class="btn-firma-save" onclick="saveFirma()">Guardar firma</button>
        </div>
      </div>
      <div class="firma-status" id="firmaStatus"></div>
      <div class="firma-saved-wrap" id="firmaSavedWrap" style="display:none">
        <div class="firma-saved-label">Firma guardada</div>
        <img id="firmaSavedImg" class="firma-saved-img" src="" alt="Firma guardada">
        <button class="btn-firma-clear" style="max-width:160px" onclick="deleteFirma()">Eliminar firma</button>
      </div>
    </div>
    <div class="config-section">
      <div class="section-title">Horario por defecto (Lunes&#8211;Viernes)</div>
      <div class="config-field"><label>Manana &#8212; Entrada</label><input id="cf_h1" type="time" value="08:00"></div>
      <div class="config-field"><label>Manana &#8212; Salida</label><input id="cf_h2" type="time" value="10:30"></div>
      <div class="config-field"><label>Tarde &#8212; Entrada</label><input id="cf_h3" type="time" value="15:00"></div>
      <div class="config-field"><label>Tarde &#8212; Salida</label><input id="cf_h4" type="time" value="20:15"></div>
    </div>
    <button class="btn-save" onclick="saveConfig()">Guardar</button>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div><div class="loading-text">Generando PDF...</div></div>
<div class="toast" id="toast"></div>

// State
var cfg, data, currentYear, currentMonth, darkMode;

function initState() {
  try { cfg = JSON.parse(localStorage.getItem('jr_cfg') || 'null') || {}; } catch(e) { cfg = {}; }
  try { data = JSON.parse(localStorage.getItem('jr_data') || 'null') || {}; } catch(e) { data = {}; }
  cfg = Object.assign({nombre:'',nif:'',afil:'',ciudad:'OVIEDO',h1:'08:00',h2:'10:30',h3:'15:00',h4:'20:15'}, cfg);
  currentYear = new Date().getFullYear();
  currentMonth = null;
  darkMode = localStorage.getItem('jr_theme') === 'dark';
}
initState();

// ── TEMA ──────────────────────────────────
function applyTheme() {
  document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
  var label = darkMode ? 'Tema claro' : 'Tema oscuro';
  var tb = document.getElementById('themeBtn');
  var tt = document.getElementById('topbarThemeBtn');
  if (tb) tb.textContent = label;
  if (tt) tt.textContent = darkMode ? 'Claro' : 'Oscuro';
}
function toggleTheme() {
  darkMode = !darkMode;
  localStorage.setItem('jr_theme', darkMode ? 'dark' : 'light');
  applyTheme();
}
applyTheme();

// ── NAVEGACION ────────────────────────────
function showScreen(id) {
  var screens = document.querySelectorAll('.screen');
  for (var i = 0; i < screens.length; i++) screens[i].classList.remove('active');
  document.getElementById('screen-' + id).classList.add('active');
  window.scrollTo(0, 0);
}
function showHome() { renderHome(); showScreen('home'); }
function showConfig() { loadConfigForm(); showScreen('config'); setTimeout(initFirmaCanvas, 80); }

// ── HOME ──────────────────────────────────
function renderHome() {
  document.getElementById('yearLabel').textContent = currentYear;
  var grid = document.getElementById('monthsGrid');
  grid.innerHTML = '';
  var now = new Date();
  for (var i = 0; i < MESES.length; i++) {
    var m = MESES[i];
    var key = currentYear + '-' + i;
    var hasData = !!data[key];
    var isCurrent = (currentYear === now.getFullYear() && i === now.getMonth());
    var hours = '';
    if (hasData) {
      var total = 0;
      for (var j = 0; j < data[key].length; j++) total += calcDayMins(data[key][j]);
      hours = fmtMins(total);
    }
    var tile = document.createElement('div');
    tile.className = 'month-tile' + (hasData ? ' done' : '') + (isCurrent ? ' current' : '');
    tile.innerHTML = '<div class="m-name">' + m + '</div>' +
      '<div class="m-status">' + (hasData ? 'Hecho' : 'Vacio') + '</div>' +
      (hours ? '<div class="m-hours">' + hours + '</div>' : '');
    (function(yr, mo) { tile.onclick = function() { openMonth(yr, mo); }; })(currentYear, i);
    grid.appendChild(tile);
  }
}
function changeYear(d) { currentYear += d; renderHome(); }

// ── CONFIG ────────────────────────────────
function loadConfigForm() {
  var keys = ['nombre','nif','afil','ciudad','h1','h2','h3','h4'];
  for (var i = 0; i < keys.length; i++) {
    var el = document.getElementById('cf_' + keys[i]);
    if (el) el.value = cfg[keys[i]] || '';
  }
}
function saveConfig() {
  var keys = ['nombre','nif','afil','ciudad','h1','h2','h3','h4'];
  for (var i = 0; i < keys.length; i++) {
    var el = document.getElementById('cf_' + keys[i]);
    if (el) cfg[keys[i]] = el.value.trim();
  }
  localStorage.setItem('jr_cfg', JSON.stringify(cfg));
  showToast('Datos guardados');
  showHome();
}

// ── MES ───────────────────────────────────
function openMonth(year, month) {
  currentMonth = {year: year, month: month};
  var key = year + '-' + month;
  if (!data[key]) { data[key] = generateMonthDays(year, month); saveData(); }
  document.getElementById('monthTitle').textContent = MESES[month] + ' ' + year;
  document.getElementById('monthMeta').innerHTML =
    '<strong>' + EMPRESA.empresa + '</strong> &nbsp;&#183;&nbsp; <strong>' + MESES[month] + ' ' + year + '</strong>';
  renderDays();
  showScreen('month');
}

function generateMonthDays(year, month) {
  var n = new Date(year, month + 1, 0).getDate();
  var days = [];
  for (var d = 1; d <= n; d++) {
    var dow = new Date(year, month, d).getDay();
    var isWe = (dow === 0 || dow === 6);
    days.push({day:d, dow:dow, festivo:false,
      h1: isWe?'':cfg.h1, h2: isWe?'':cfg.h2,
      h3: isWe?'':cfg.h3, h4: isWe?'':cfg.h4});
  }
  return days;
}

function autoFillMonth() {
  var key = currentMonth.year + '-' + currentMonth.month;
  var hasSome = data[key] && data[key].some(function(d) { return d.h1||d.h3; });
  if (hasSome && !confirm('Rellenar con el horario por defecto?')) return;
  data[key] = generateMonthDays(currentMonth.year, currentMonth.month);
  saveData(); renderDays(); showToast('Mes rellenado');
}
function clearMonth() {
  if (!confirm('Vaciar todos los dias?')) return;
  var key = currentMonth.year + '-' + currentMonth.month;
  data[key].forEach(function(d) { d.h1=d.h2=d.h3=d.h4=''; d.festivo=false; });
  saveData(); renderDays(); showToast('Mes vaciado');
}

function renderDays() {
  var key = currentMonth.year + '-' + currentMonth.month;
  var days = data[key];
  var list = document.getElementById('daysList');
  list.innerHTML = '';
  for (var i = 0; i < days.length; i++) {
    var d = days[i];
    var isWe = (d.dow===0||d.dow===6);
    var cls = 'day-card';
    if (d.festivo) cls += ' festivo';
    else if (isWe) cls += ' weekend';
    else cls += ' workday';
    if (isCustomDay(d)) cls += ' modified';
    var mins = calcDayMins(d);
    var preview = buildPreview(d, isWe);
    var card = document.createElement('div');
    card.className = cls;
    card.id = 'day-' + i;
    card.innerHTML =
      '<div class="day-header" onclick="toggleDay('+i+')">' +
        '<div class="day-num-wrap"><span class="day-num">'+d.day+'</span><span class="day-name-lbl">'+DIAS[d.dow]+'</span></div>' +
        '<div class="day-summary"><div class="day-preview'+(!d.h1&&!d.h3?' empty':'')+'">'+preview+'</div></div>' +
        (mins>0 ? '<div class="day-total">'+fmtMins(mins)+'</div>' : '') +
      '</div>' +
      '<div class="day-body">' +
        '<div class="time-grid">' +
          '<div class="time-field"><label>Manana entrada</label><input type="time" value="'+d.h1+'" onchange="updateTime('+i+',\'h1\',this.value)"></div>' +
          '<div class="time-field"><label>Manana salida</label><input type="time" value="'+d.h2+'" onchange="updateTime('+i+',\'h2\',this.value)"></div>' +
          '<div class="time-field"><label>Tarde entrada</label><input type="time" value="'+d.h3+'" onchange="updateTime('+i+',\'h3\',this.value)"></div>' +
          '<div class="time-field"><label>Tarde salida</label><input type="time" value="'+d.h4+'" onchange="updateTime('+i+',\'h4\',this.value)"></div>' +
        '</div>' +
        '<div class="day-actions">' +
          '<button class="day-btn btn-festivo'+(d.festivo?' on':'')+'" onclick="toggleFestivo('+i+')">'+(d.festivo?'Festivo activo':'Marcar festivo')+'</button>' +
          '<button class="day-btn btn-reset" onclick="resetDay('+i+')">Restablecer</button>' +
          '<button class="day-btn btn-clear" onclick="clearDay('+i+')">Vaciar</button>' +
        '</div>' +
      '</div>';
    list.appendChild(card);
  }
  updateTotal();
}

function buildPreview(d, isWe) {
  if (d.festivo) return 'Festivo / dia libre';
  if (isWe) return 'Fin de semana';
  if (!d.h1 && !d.h3) return 'Sin horas registradas';
  var p = [];
  if (d.h1||d.h2) p.push((d.h1||'?')+' - '+(d.h2||'?'));
  if (d.h3||d.h4) p.push((d.h3||'?')+' - '+(d.h4||'?'));
  return p.join('  ·  ');
}
function isCustomDay(d) {
  if (d.dow===0||d.dow===6||d.festivo) return false;
  return d.h1!==cfg.h1||d.h2!==cfg.h2||d.h3!==cfg.h3||d.h4!==cfg.h4;
}
function toggleDay(i) { document.getElementById('day-'+i).classList.toggle('open'); }
function updateTime(i, field, val) {
  var key = currentMonth.year+'-'+currentMonth.month;
  data[key][i][field] = val; data[key][i].festivo = false;
  saveData(); refreshDay(i); updateTotal();
}
function toggleFestivo(i) {
  var key = currentMonth.year+'-'+currentMonth.month, d = data[key][i];
  d.festivo = !d.festivo;
  if (d.festivo) { d.h1=d.h2=d.h3=d.h4=''; }
  else if (d.dow!==0&&d.dow!==6) { d.h1=cfg.h1;d.h2=cfg.h2;d.h3=cfg.h3;d.h4=cfg.h4; }
  saveData(); refreshDay(i); updateTotal();
}
function resetDay(i) {
  var key = currentMonth.year+'-'+currentMonth.month, d = data[key][i];
  d.festivo = false;
  var isWe = (d.dow===0||d.dow===6);
  d.h1=isWe?'':cfg.h1; d.h2=isWe?'':cfg.h2; d.h3=isWe?'':cfg.h3; d.h4=isWe?'':cfg.h4;
  saveData(); refreshDay(i); updateTotal();
}
function clearDay(i) {
  var key = currentMonth.year+'-'+currentMonth.month, d = data[key][i];
  d.h1=d.h2=d.h3=d.h4=''; d.festivo=false;
  saveData(); refreshDay(i); updateTotal();
}
function refreshDay(i) {
  var key = currentMonth.year+'-'+currentMonth.month, d = data[key][i];
  var isWe = (d.dow===0||d.dow===6);
  var card = document.getElementById('day-'+i);
  var wasOpen = card.classList.contains('open');
  var cls = 'day-card';
  if (d.festivo) cls+=' festivo'; else if (isWe) cls+=' weekend'; else cls+=' workday';
  if (isCustomDay(d)) cls+=' modified';
  if (wasOpen) cls+=' open';
  card.className = cls;
  var prev = card.querySelector('.day-preview');
  prev.textContent = buildPreview(d, isWe);
  prev.className = 'day-preview'+(!d.h1&&!d.h3?' empty':'');
  var mins = calcDayMins(d), te = card.querySelector('.day-total');
  if (mins>0) {
    if (te) te.textContent = fmtMins(mins);
    else { var nt=document.createElement('div'); nt.className='day-total'; nt.textContent=fmtMins(mins); card.querySelector('.day-summary').after(nt); }
  } else if (te) te.remove();
  var ins = card.querySelectorAll('input[type=time]');
  if (ins.length===4) { ins[0].value=d.h1;ins[1].value=d.h2;ins[2].value=d.h3;ins[3].value=d.h4; }
  var fb = card.querySelector('.btn-festivo');
  if (fb) { fb.className='day-btn btn-festivo'+(d.festivo?' on':''); fb.textContent=d.festivo?'Festivo activo':'Marcar festivo'; }
}
function updateTotal() {
  var key = currentMonth.year+'-'+currentMonth.month;
  var total = 0;
  data[key].forEach(function(d) { total += calcDayMins(d); });
  document.getElementById('totalValue').textContent = fmtMins(total);
}
function calcDayMins(d) {
  if (!d.h1&&!d.h3) return 0;
  var m = 0;
  if (d.h1&&d.h2) m += timeDiff(d.h1,d.h2);
  if (d.h3&&d.h4) m += timeDiff(d.h3,d.h4);
  return m;
}
function timeDiff(a, b) {
  var ap=a.split(':'), bp=b.split(':');
  return Math.max(0,(parseInt(bp[0])*60+parseInt(bp[1]))-(parseInt(ap[0])*60+parseInt(ap[1])));
}
function fmtMins(m) { return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'min'; }
function saveData() { localStorage.setItem('jr_data', JSON.stringify(data)); }
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2200);
}

// ── FIRMA CANVAS ──────────────────────────
var _fc = null, _ctx = null, _drawing = false, _lx = 0, _ly = 0, _hasStrokes = false;

function initFirmaCanvas() {
  _fc = document.getElementById('firmaCanvas');
  if (!_fc) return;
  _ctx = _fc.getContext('2d');
  _ctx.strokeStyle = '#1a1a2e';
  _ctx.lineWidth = 2.5;
  _ctx.lineCap = 'round';
  _ctx.lineJoin = 'round';
  _hasStrokes = false;
  _fc.removeEventListener('mousedown', _onStart);
  _fc.removeEventListener('mousemove', _onMove);
  _fc.removeEventListener('mouseup', _onEnd);
  _fc.removeEventListener('mouseleave', _onEnd);
  _fc.removeEventListener('touchstart', _onStart);
  _fc.removeEventListener('touchmove', _onMove);
  _fc.removeEventListener('touchend', _onEnd);
  _fc.addEventListener('mousedown', _onStart);
  _fc.addEventListener('mousemove', _onMove);
  _fc.addEventListener('mouseup', _onEnd);
  _fc.addEventListener('mouseleave', _onEnd);
  _fc.addEventListener('touchstart', _onStart, {passive:false});
  _fc.addEventListener('touchmove', _onMove, {passive:false});
  _fc.addEventListener('touchend', _onEnd, {passive:false});
  refreshFirmaSavedUI();
}
function _getPos(e) {
  var rect = _fc.getBoundingClientRect();
  var sx = _fc.width / rect.width, sy = _fc.height / rect.height;
  var src = e.touches ? e.touches[0] : e;
  return {x:(src.clientX-rect.left)*sx, y:(src.clientY-rect.top)*sy};
}
function _onStart(e) {
  e.preventDefault(); _drawing=true; _hasStrokes=true;
  var p=_getPos(e); _lx=p.x; _ly=p.y;
  _ctx.beginPath(); _ctx.arc(_lx,_ly,1.2,0,Math.PI*2);
  _ctx.fillStyle='#1a1a2e'; _ctx.fill();
}
function _onMove(e) {
  e.preventDefault(); if(!_drawing) return;
  var p=_getPos(e);
  _ctx.beginPath(); _ctx.moveTo(_lx,_ly); _ctx.lineTo(p.x,p.y); _ctx.stroke();
  _lx=p.x; _ly=p.y;
}
function _onEnd(e) { e.preventDefault(); _drawing=false; }

function clearFirmaCanvas() {
  if (_ctx) _ctx.clearRect(0,0,_fc.width,_fc.height);
  _hasStrokes=false;
  document.getElementById('firmaStatus').textContent='';
}
function saveFirma() {
  if (!_fc||!_hasStrokes) { document.getElementById('firmaStatus').textContent='Dibuja la firma primero'; return; }
  var img = _ctx.getImageData(0,0,_fc.width,_fc.height);
  var minX=_fc.width,minY=_fc.height,maxX=0,maxY=0;
  for (var y=0;y<_fc.height;y++) for (var x=0;x<_fc.width;x++)
    if (img.data[(y*_fc.width+x)*4+3]>10) { minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y); }
  if (maxX<=minX||maxY<=minY) { document.getElementById('firmaStatus').textContent='La firma esta vacia'; return; }
  var pad=12, cx=Math.max(0,minX-pad), cy=Math.max(0,minY-pad);
  var cw=Math.min(_fc.width,maxX+pad)-cx, ch=Math.min(_fc.height,maxY+pad)-cy;
  var tmp=document.createElement('canvas'); tmp.width=cw; tmp.height=ch;
  var tc=tmp.getContext('2d');
  tc.fillStyle='#ffffff'; tc.fillRect(0,0,cw,ch);
  tc.drawImage(_fc,cx,cy,cw,ch,0,0,cw,ch);
  var url=tmp.toDataURL('image/png');
  localStorage.setItem('jr_firma',url);
  refreshFirmaSavedUI(); clearFirmaCanvas();
  document.getElementById('firmaStatus').textContent='Firma guardada';
  setTimeout(function(){var s=document.getElementById('firmaStatus');if(s)s.textContent='';},2500);
}
function deleteFirma() {
  if (!confirm('Eliminar la firma guardada?')) return;
  localStorage.removeItem('jr_firma');
  refreshFirmaSavedUI();
}
function refreshFirmaSavedUI() {
  var url=localStorage.getItem('jr_firma');
  var wrap=document.getElementById('firmaSavedWrap');
  var img=document.getElementById('firmaSavedImg');
  if (!wrap||!img) return;
  if (url) { wrap.style.display='flex'; img.src=url; }
  else { wrap.style.display='none'; img.src=''; }
}

// ── PDF ────────────────────────────────────────────────────
function downloadPDF() {
  var year=currentMonth.year, month=currentMonth.month;
  var key=year+'-'+month, days=data[key];
  var mesNombre=MESES[month].toUpperCase();
  var mesNum=String(month+1).padStart(2,'0');
  var lastDay=new Date(year,month+1,0).getDate();

  document.getElementById('loadingOverlay').classList.add('show');
  setTimeout(function() {
    try {
      var doc=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
      var PH=297,ML=10,MR=10,MT=8;
      var CW=210-ML-MR;
      var y=MT;
      var G=[230,230,230],DG=[150,150,150],BK=[28,28,28],BL=[26,82,118];
      var lw=0.22;

      function box(x,yy,w,h,fill,draw){
        doc.setFillColor.apply(doc,fill||[255,255,255]);
        doc.setDrawColor.apply(doc,draw||DG);
        doc.setLineWidth(lw); doc.rect(x,yy,w,h,'FD');
      }
      function boxS(x,yy,w,h,draw){
        doc.setDrawColor.apply(doc,draw||DG);
        doc.setLineWidth(lw); doc.rect(x,yy,w,h,'S');
      }
      function vl(x,yy,h,c){ doc.setDrawColor.apply(doc,c||DG); doc.setLineWidth(lw); doc.line(x,yy,x,yy+h); }
      function hl(x,yy,w,c){ doc.setDrawColor.apply(doc,c||DG); doc.setLineWidth(lw); doc.line(x,yy,x+w,yy); }
      function t(text,x,yy,bold,sz,align,color){
        doc.setFont('helvetica',bold?'bold':'normal');
        doc.setFontSize(sz||8.5);
        doc.setTextColor.apply(doc,color||BK);
        doc.text(String(text),x,yy,{align:align||'left'});
      }

      // TITULO
      box(ML,y,CW,7,G); t('Listado Resumen mensual del registro de jornada (detalle horario)',ML+CW/2,y+4.8,true,10,'center'); y+=7;

      // CABECERA
      var HR=5.8, HLW=CW/2, LAB=40, LAB2=30;
      var hdrRows=[
        ['Empresa:',EMPRESA.empresa,'Trabajador:',cfg.nombre||''],
        ['C.I.F./N.I.F.:',EMPRESA.cif,'N.I.F.:',cfg.nif||''],
        ['Centro de Trabajo:',EMPRESA.centro,'N\u00BA Afiliaci\u00F3n:',cfg.afil||''],
        ['C.C.C.:',EMPRESA.ccc,'Mes y A\u00F1o:',mesNum+'/'+year]
      ];
      hdrRows.forEach(function(r){
        box(ML,y,CW,HR,G); vl(ML+HLW,y,HR);
        t(r[0],ML+1.5,y+4.0,true,8.5); t(r[1],ML+LAB,y+4.0,false,8.5);
        t(r[2],ML+HLW+1.5,y+4.0,true,8.5); t(r[3],ML+HLW+LAB2,y+4.0,false,8.5);
        y+=HR;
      });

      // TABLA HEADER
      var CA=12,CB=28,CC=28,CD=28,CE=28,CF=CW-CA-CB-CC-CD-CE;
      var XA=ML,XB=XA+CA,XC=XB+CB,XD=XC+CC,XE=XD+CD,XF=XE+CE;

      box(ML,y,CW,6,G);
      vl(XB,y,6); vl(XD,y,6); vl(XF,y,6);
      t('DIA',XA+CA/2,y+4.2,true,8,'center');
      t('MA\u00D1ANAS',XB+(CB+CC)/2,y+4.2,true,8,'center');
      t('TARDES',XD+(CD+CE)/2,y+4.2,true,8,'center');
      t('FIRMA DEL TRABAJADOR / A',XF+CF/2,y+4.2,true,7.5,'center');
      y+=6;

      box(ML,y,CW,5.2,G);
      vl(XB,y,5.2); vl(XC,y,5.2); vl(XD,y,5.2); vl(XE,y,5.2); vl(XF,y,5.2);
      t('ENTRADA',XB+CB/2,y+3.6,true,7.5,'center');
      t('SALIDA',XC+CC/2,y+3.6,true,7.5,'center');
      t('ENTRADA',XD+CD/2,y+3.6,true,7.5,'center');
      t('SALIDA',XE+CE/2,y+3.6,true,7.5,'center');
      y+=5.2;

      // DIAS
      var DR=4.8;
      days.forEach(function(d){
        var isWe=(d.dow===0||d.dow===6);
        var bg=d.festivo?[255,251,230]:(isWe?[246,247,248]:null);
        var bdr=d.festivo?[245,220,100]:(isWe?[220,220,220]:DG);
        if(bg) box(ML,y,CW,DR,bg,bdr); else boxS(ML,y,CW,DR,bdr);
        [XB,XC,XD,XE,XF].forEach(function(x){vl(x,y,DR,bdr);});
        var ty=y+DR*0.7, dc=isWe||d.festivo?[180,180,180]:BK;
        t(String(d.day),XA+CA/2,ty,false,8,'center',dc);
        if(!isWe&&!d.festivo){
          if(d.h1)t(d.h1,XB+CB/2,ty,false,8,'center');
          if(d.h2)t(d.h2,XC+CC/2,ty,false,8,'center');
          if(d.h3)t(d.h3,XD+CD/2,ty,false,8,'center');
          if(d.h4)t(d.h4,XE+CE/2,ty,false,8,'center');
        }
        y+=DR;
      });
      hl(ML,y,CW);

      // TOTAL
      y+=1.5;
      var totalMins=0; days.forEach(function(d){totalMins+=calcDayMins(d);});
      var totalStr=Math.floor(totalMins/60)+'h '+String(totalMins%60).padStart(2,'0')+'min';
      box(ML,y,CW,7.5,G);
      t('TOTAL HRAS.:',ML+CW-65,y+5,true,9);
      t(totalStr,ML+CW-3,y+5,true,11,'right',BL);
      y+=9;

      // FIRMAS
      y+=3;
      t('Firma de la empresa:',ML,y,false,8.5);
      t('Firma del trabajador/a:',ML+CW/2+2,y,false,8.5);
      y+=4;
      var spaceLeft=PH-8-y-14;
      var FBH=Math.min(32,Math.max(22,spaceLeft));
      var FBW=(CW/2)-4;

      // Caja empresa
      box(ML,y,FBW,FBH,[252,252,252],[200,200,200]);
      try {
        var maxW=FBW-6, maxH=FBH-4;
        var ratio=115/150;
        var iW=maxW, iH=iW*ratio;
        if(iH>maxH){iH=maxH;iW=iH/ratio;}
        doc.addImage(FIRMA_EMPRESA,'PNG',ML+(FBW-iW)/2,y+(FBH-iH)/2,iW,iH);
      } catch(e){}

      // Caja trabajador
      box(ML+CW/2+2,y,FBW,FBH,[252,252,252],[200,200,200]);
      var workerFirma = localStorage.getItem('jr_firma');
      if (workerFirma) {
        try {
          doc.addImage(workerFirma,'PNG',ML+CW/2+2+3,y+3,FBW-6,FBH-6);
        } catch(e) {
          t('(firma a mano)',ML+CW/2+2+FBW/2,y+FBH/2+1,false,7,'center',[190,190,190]);
        }
      } else {
        t('(firma a mano)',ML+CW/2+2+FBW/2,y+FBH/2+1,false,7,'center',[190,190,190]);
      }
      y+=FBH+5;

      // FECHA
      t('En '+cfg.ciudad+', a '+lastDay+' de '+mesNombre+' de '+year,ML+CW/2,y,false,9,'center');
      y+=7;

      // LEGAL
      doc.setFont('helvetica','normal'); doc.setFontSize(6.2); doc.setTextColor(130,130,130);
      doc.text('Registro realizado en cumplimiento del Art. 34.9 del texto refundido de la Ley del Estatuto de los Trabajadores.',ML,y,{maxWidth:CW});
      y+=4;
      doc.text('La empresa conservara los registros a que se refiere este precepto durante cuatro anos y permanecen a disposicion de las personas trabajadoras, de sus representantes legales y de la Inspeccion de Trabajo y Seguridad Social.',ML,y,{maxWidth:CW});

      doc.save('registro_jornada_'+MESES[month].toLowerCase()+'_'+year+'.pdf');
      showToast('PDF descargado');
    } catch(err) {
      console.error(err); showToast('Error al generar PDF');
    } finally {
      document.getElementById('loadingOverlay').classList.remove('show');
    }
  }, 80);
}

renderHome();
</script>
